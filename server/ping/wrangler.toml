name = "repoladder-ping"
main = "worker.ts"
compatibility_date = "2026-09-01"
# No logs of requests: the worker keeps only the tallies in D1.
workers_dev = false
routes = [{ pattern = "ping.repoladder.com", custom_domain = true }]

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "repoladder-ping"
# Paste the id printed by `npx wrangler d1 create repoladder-ping` (see README.md).
database_id = "5bc03136-b6b0-40bc-9419-c8c5dcac6f76"
