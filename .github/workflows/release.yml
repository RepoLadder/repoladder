# Opens (and keeps current) the "Version Packages" PR on main while changesets are pending, runs CI on it,
# and merges a minor or patch one with auto-merge once the required checks pass; a major is left for a person
# (the push-to-main publish then waits at the major approval). Merging bumps package.json and writes
# CHANGELOG.md. A merge made with GITHUB_TOKEN starts no workflow, so this workflow then dispatches
# publish.yml itself. It never publishes by itself: publish.yml keeps every publish guard.
name: Release

on:
  push:
    branches: [main]
    paths: [".changeset/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release-version-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-pr:
    if: github.repository == 'RepoLadder/repoladder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          pr-title: "Version Packages (repoladder)"
          commit-message: "chore: version packages"
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN pushes and PRs start no workflows; a workflow_dispatch does. Run CI on the release
      # branch so the Version Packages PR gets the required checks.
      - name: Run CI on the Version Packages PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
      - name: Auto-merge minor and patch
        id: automerge
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.changesets.outputs.pr-number }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          set -euo pipefail
          version() {
            gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$1" \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"
          }
          OLD=$(version main)
          NEW=$(version "$RELEASE_BRANCH")
          if [ "${NEW%%.*}" != "${OLD%%.*}" ]; then
            echo "::notice::major release: the Version Packages PR is left for a person to merge"
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REQUIRED=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$REQUIRED" = "0" ]; then
            echo "::warning::main requires no status checks, so auto-merge would merge without waiting for CI; the Version Packages PR is left for a person"
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --merge
          echo "merge=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
      - name: Wait for the merge
        if: steps.changesets.outputs.pr-number != '' && steps.automerge.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          for _ in $(seq 1 100); do
            STATE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
            case "$STATE" in
              MERGED) exit 0 ;;
              CLOSED) echo "::error::the Version Packages PR was closed without merging"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::the Version Packages PR did not merge within 50 minutes; it is left open for a person"
          exit 1
      - name: Publish the new version
        if: steps.changesets.outputs.pr-number != '' && steps.automerge.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.automerge.outputs.version }}
        run: |
          set -euo pipefail
          MAIN=$(gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/package.json?ref=main" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$MAIN" != "$VERSION" ]; then
            echo "::error::main is at $MAIN, expected $VERSION; not dispatching the publish"
            exit 1
          fi
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION" -f dry-run=false
