# Dependency PRs target develop and run CI like any other PR into develop. Dependabot reads this file
# from the default branch (main), so edits made on develop only take effect after a release.
# Dependency bump PRs. Review and merge them on their own.
# @repoladder/brand gets a PR of its own so a brand release is easy to review (visual shots) and revert.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: []
    # TypeScript 7 is the native compiler and has no JS API; the analyzers use the compiler API.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        patterns: ["*"]
        exclude-patterns: ["@repoladder/brand"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: []
