name: Leak guard
description: Installs a pinned, checksum-verified gitleaks and runs scripts/leakguard.ts with the secrets scan required.

runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
        echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/gitleaks"
        tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
    - name: Scan
      shell: bash
      run: node scripts/leakguard.ts --require-gitleaks
